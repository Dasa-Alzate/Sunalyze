services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sunalyze}
      MYSQL_USER: ${MYSQL_USER:-sunalyze}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?define MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-sunalyze}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-sunalyze}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      SUPERADMIN_IP_ALLOWLIST: ${SUPERADMIN_IP_ALLOWLIST:-}
      SUPERADMIN_TRUST_PROXY: ${SUPERADMIN_TRUST_PROXY:-1}
    ports:
      - "${WEB_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  db_data:

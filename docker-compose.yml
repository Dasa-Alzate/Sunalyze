services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sunalyze}
      MYSQL_USER: ${MYSQL_USER:-sunalyze}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?define MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-sunalyze}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-sunalyze}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      CACHE_TYPE: RedisCache
      CACHE_REDIS_URL: redis://redis:6379/1
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      SUPERADMIN_IP_ALLOWLIST: ${SUPERADMIN_IP_ALLOWLIST:-}
      SUPERADMIN_TRUST_PROXY: ${SUPERADMIN_TRUST_PROXY:-1}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
      MAIL_BACKEND: ${MAIL_BACKEND:-log}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USERNAME: ${MAIL_SMTP_USERNAME:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_SMTP_STARTTLS: ${MAIL_SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TIMEOUT: ${MAIL_TIMEOUT:-10}
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    restart: unless-stopped

volumes:
  db_data:

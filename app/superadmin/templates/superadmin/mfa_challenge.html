<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunalyze · Superadmin · Verificación MFA</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#0f1115; color:#e6e8ec; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
    .box { width:340px; background:#171a21; border:1px solid #262b35; border-radius:12px; padding:28px; }
    h1 { font-size:18px; margin:0 0 4px; }
    p { color:#9aa3b2; margin:0 0 20px; font-size:13px; }
    label { display:block; color:#9aa3b2; font-size:12px; margin:12px 0 4px; }
    input { width:100%; padding:9px 11px; background:#0d0f13; border:1px solid #262b35; border-radius:6px; color:#e6e8ec; }
    button { width:100%; margin-top:18px; padding:10px; background:#4f8cff; color:#fff; border:none; border-radius:6px; font:inherit; cursor:pointer; }
    .flash { padding:9px 12px; border-radius:8px; margin-bottom:14px; border:1px solid #f85149; color:#f85149; font-size:13px; }
  </style>
</head>
<body>
  <form class="box" method="post" action="{{ url_for('superadmin.mfa_challenge') }}">
    <h1>Verificación en dos pasos</h1>
    <p>Introduce el código de tu authenticator o un código de recuperación.</p>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}<div class="flash">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Código</label>
    <input type="text" name="code" autocomplete="one-time-code" required autofocus>
    <button type="submit">Verificar</button>
  </form>
</body>
</html>

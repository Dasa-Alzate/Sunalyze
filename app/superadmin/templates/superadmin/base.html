<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunalyze · Superadmin{% block title %}{% endblock %}</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --line:#262b35; --txt:#e6e8ec; --mut:#9aa3b2; --acc:#4f8cff; --ok:#2ea043; --warn:#d29922; --err:#f85149; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
    header { display:flex; align-items:center; gap:16px; padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
    header .brand { font-weight:700; letter-spacing:.5px; }
    nav { display:flex; gap:4px; flex-wrap:wrap; flex:1; }
    nav a { color:var(--mut); text-decoration:none; padding:6px 10px; border-radius:6px; }
    nav a:hover, nav a.active { color:var(--txt); background:#222733; }
    .who { color:var(--mut); font-size:12px; }
    main { max-width:1100px; margin:0 auto; padding:24px 20px; }
    h1 { font-size:20px; margin:0 0 16px; }
    h2 { font-size:15px; color:var(--mut); margin:24px 0 8px; text-transform:uppercase; letter-spacing:.5px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
    .card .n { font-size:26px; font-weight:700; }
    .card .l { color:var(--mut); font-size:12px; }
    table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
    tr:last-child td { border-bottom:none; }
    .tag { display:inline-block; padding:2px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
    .tag.ok { color:var(--ok); border-color:var(--ok); }
    .tag.warn { color:var(--warn); border-color:var(--warn); }
    .tag.err { color:var(--err); border-color:var(--err); }
    .tag.acc { color:var(--acc); border-color:var(--acc); }
    button, .btn { font:inherit; cursor:pointer; border:1px solid var(--line); background:#222733; color:var(--txt); padding:6px 12px; border-radius:6px; text-decoration:none; display:inline-block; }
    button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
    button.danger { border-color:var(--err); color:var(--err); }
    input[type=text], input[type=password], input[type=email], textarea, select { width:100%; padding:8px 10px; background:#0d0f13; border:1px solid var(--line); border-radius:6px; color:var(--txt); }
    label { display:block; color:var(--mut); font-size:12px; margin:10px 0 4px; }
    .flash { padding:10px 14px; border-radius:8px; margin-bottom:12px; border:1px solid var(--line); }
    .flash.ok { border-color:var(--ok); color:var(--ok); }
    .flash.error { border-color:var(--err); color:var(--err); }
    .muted { color:var(--mut); }
    form.inline { display:inline; }
    .row { display:flex; gap:12px; align-items:flex-end; }
  </style>
</head>
<body>
  <header>
    <span class="brand">Sunalyze · Superadmin</span>
    <nav>
      <a href="{{ url_for('superadmin.index') }}" class="{{ 'active' if active_nav=='dash' }}">Dashboard</a>
      <a href="{{ url_for('superadmin.equipment_review') }}" class="{{ 'active' if active_nav=='equip' }}">Equipos</a>
      <a href="{{ url_for('superadmin.migrations_view') }}" class="{{ 'active' if active_nav=='migr' }}">Migraciones</a>
      <a href="{{ url_for('superadmin.users_view') }}" class="{{ 'active' if active_nav=='users' }}">Usuarios</a>
      <a href="{{ url_for('superadmin.orgs_view') }}" class="{{ 'active' if active_nav=='orgs' }}">Organizaciones</a>
      <a href="{{ url_for('superadmin.tickets_view') }}" class="{{ 'active' if active_nav=='tickets' }}">Tickets</a>
      <a href="{{ url_for('superadmin.audit_view') }}" class="{{ 'active' if active_nav=='audit' }}">Auditoría</a>
    </nav>
    <form class="inline" method="post" action="{{ url_for('superadmin.logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button>Salir</button>
    </form>
  </header>
  <main>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block body %}{% endblock %}
  </main>
</body>
</html>
